services:
  # -------------------------------------------------------------
  # RYDO BACKEND API (FastAPI + WebSockets + SQLAlchemy)
  # -------------------------------------------------------------
  - type: web
    name: rydo-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rydo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production

  # -------------------------------------------------------------
  # RYDO FRONTEND (React + Vite + Tailwind + Leaflet)
  # -------------------------------------------------------------
  - type: web
    name: rydo-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rydo-api
          property: host

databases:
  # -------------------------------------------------------------
  # RYDO MANAGED POSTGRESQL DATABASE
  # -------------------------------------------------------------
  - name: rydo-db
    region: oregon
    plan: free
    databaseName: rydo
    user: rydo_user
