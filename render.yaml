services:
  # -------------------------------------------------------------
  # RYDO BACKEND API
  # FastAPI + WebSockets + SQLAlchemy + PostgreSQL
  # -------------------------------------------------------------
  - type: web
    name: rydo-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rydo-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

      - key: CORS_ORIGINS
        value: "*"

      - key: ENVIRONMENT
        value: production

      - key: CURRENCY
        value: INR

      - key: CURRENCY_SYMBOL
        value: "₹"

      - key: CURRENCY_LOCALE
        value: en-IN

      - key: AI_PROVIDER
        value: builtin

      - key: AI_MODEL
        value: rydo-mobility-v1


  # -------------------------------------------------------------
  # RYDO FRONTEND
  # React + Vite + Tailwind + Leaflet + Three.js
  # -------------------------------------------------------------
  - type: web
    name: rydo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rydo-api
          property: host


databases:
  # -------------------------------------------------------------
  # RYDO MANAGED POSTGRESQL DATABASE
  # -------------------------------------------------------------
  - name: rydo-db
    region: oregon
    plan: free
    databaseName: rydo
    user: rydo_user